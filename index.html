<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Monster Truck</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Monster Truck">
  <meta name="theme-color" content="#ff7a1a">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- In-game HUD -->
  <div id="hud" class="hidden">
    <div id="stars"><span class="star-icon">⭐</span><span id="star-count">0</span></div>
    <div id="score"><span>🏆</span><span id="score-count">0</span></div>
    <div id="arrow-left" class="arrow">◀</div>
    <div id="arrow-right" class="arrow">▶</div>
    <div id="honk" data-btn="honk">📣</div>
    <div id="garage" data-btn="garage"><span>🏠</span><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/></svg></div>
  </div>

  <div id="popups"></div>
  <div id="wow"></div>

  <!-- Pick-your-truck screen -->
  <div id="pick">
    <h1>MONSTER<br>TRUCK!</h1>
    <div id="truck-choices"></div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
